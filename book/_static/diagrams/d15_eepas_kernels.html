<style>
:where(:root){--dg-paper:#fbfcfd;--dg-paper-2:#eef2f7;--dg-ink:#243040;--dg-muted:#56657a;--dg-soft:#7d8797;--dg-rule:rgba(36,48,64,.12);--dg-accent:#2a78d6;--dg-accent-tint:rgba(42,120,214,.08);--dg-quake:#e34948;}

.dg-d15_eepas_kernels:has(label:hover) [data-detail]{display:none!important}

</style><div class="dg-d15_eepas_kernels" data-teaching-widget="d15_eepas_kernels"><p class="intro">圖中的乘積是核結構。完整預報還含產能／門檻修正、事件權重與背景混合。</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 544" role="img" aria-labelledby="dg-d15_eepas_kernels-title dg-d15_eepas_kernels-desc"><title id="dg-d15_eepas_kernels-title">EEPAS：一顆事件的三個核</title><desc id="dg-d15_eepas_kernels-desc">輸入事件的規模決定規模、時間、空間三核的尺度；三核相乘、加權後，再與其他事件和背景相加。</desc><rect x="96" y="16" width="288" height="72" rx="8" class="node "/><text x="240.0" y="48" class="name" text-anchor="middle">一顆輸入事件</text><text x="240.0" y="76" class="sub" text-anchor="middle">時間、位置、規模</text><g data-detail-mark="magnitude"><text x="24" y="160" class="name" text-anchor="start">規模核 g(m)</text><text x="24" y="192" class="sub" text-anchor="start">未來規模</text><path d="M 252 208 H 452" class="edge"/><polyline points="252.00,206.65 256.17,206.15 260.33,205.50 264.50,204.66 268.67,203.61 272.83,202.30 277.00,200.69 281.17,198.76 285.33,196.48 289.50,193.82 293.67,190.78 297.83,187.37 302.00,183.61 306.17,179.54 310.33,175.24 314.50,170.80 318.67,166.31 322.83,161.91 327.00,157.71 331.17,153.87 335.33,150.50 339.50,147.74 343.67,145.69 347.83,144.43 352.00,144.00 356.17,144.43 360.33,145.69 364.50,147.74 368.67,150.50 372.83,153.87 377.00,157.71 381.17,161.91 385.33,166.31 389.50,170.80 393.67,175.24 397.83,179.54 402.00,183.61 406.17,187.37 410.33,190.78 414.50,193.82 418.67,196.48 422.83,198.76 427.00,200.69 431.17,202.30 435.33,203.61 439.50,204.66 443.67,205.50 447.83,206.15 452.00,206.65" class="curve"/></g><g data-detail-mark="time"><text x="24" y="272" class="name" text-anchor="start">時間核 f(t)</text><text x="24" y="304" class="sub" text-anchor="start">距輸入事件多久</text><path d="M 252 320 H 452" class="edge"/><polyline points="252.00,320.00 256.17,320.00 260.33,319.84 264.50,318.08 268.67,312.56 272.83,303.04 277.00,291.31 281.17,279.67 285.33,269.84 289.50,262.69 293.67,258.40 297.83,256.71 302.00,257.15 306.17,259.20 310.33,262.37 314.50,266.25 318.67,270.50 322.83,274.88 327.00,279.20 331.17,283.35 335.33,287.26 339.50,290.87 343.67,294.17 347.83,297.16 352.00,299.85 356.17,302.25 360.33,304.39 364.50,306.28 368.67,307.95 372.83,309.42 377.00,310.72 381.17,311.85 385.33,312.85 389.50,313.73 393.67,314.49 397.83,315.16 402.00,315.75 406.17,316.26 410.33,316.71 414.50,317.11 418.67,317.45 422.83,317.76 427.00,318.02 431.17,318.25 435.33,318.46 439.50,318.64 443.67,318.79 447.83,318.93 452.00,319.05" class="curve"/></g><g data-detail-mark="space"><text x="24" y="384" class="name" text-anchor="start">空間核 h(x,y)</text><text x="24" y="416" class="sub" text-anchor="start">距輸入震央多遠</text><circle cx="352" cy="400" r="16" class="curve-other"/><circle cx="352" cy="400" r="32" class="curve-other"/><circle cx="352" cy="400" r="48" class="curve-other"/><circle cx="352" cy="400" r="8" class="dot"/></g><text x="240" y="480" class="name" text-anchor="middle">單顆貢獻 ∝ g × f × h</text><text x="240" y="516" class="sub" text-anchor="middle">乘上權重，再加總所有事件</text></svg><div class="choices" role="group" aria-label="選擇圖中概念；也可用 Tab 與方向鍵"><span><input type="radio" id="dg-d15_eepas_kernels-choice-magnitude" name="dg-d15_eepas_kernels-choice" value="magnitude" aria-controls="dg-d15_eepas_kernels-panel-magnitude" checked><label for="dg-d15_eepas_kernels-choice-magnitude">規模核</label></span><span><input type="radio" id="dg-d15_eepas_kernels-choice-time" name="dg-d15_eepas_kernels-choice" value="time" aria-controls="dg-d15_eepas_kernels-panel-time" ><label for="dg-d15_eepas_kernels-choice-time">時間核</label></span><span><input type="radio" id="dg-d15_eepas_kernels-choice-space" name="dg-d15_eepas_kernels-choice" value="space" aria-controls="dg-d15_eepas_kernels-panel-space" ><label for="dg-d15_eepas_kernels-choice-space">空間核</label></span></div><div class="details" aria-live="polite"><section id="dg-d15_eepas_kernels-panel-magnitude" data-detail="magnitude" aria-label="規模核"><h4>規模核</h4><p>輸入事件的規模，決定它對哪些未來規模較有貢獻。這是密度分配，不是把輸入規模直接當作下一次地震的規模。</p></section><section id="dg-d15_eepas_kernels-panel-time" data-detail="time" aria-label="時間核"><h4>時間核</h4><p>時間核在正的時間差上分配貢獻。對數時間的中心與散布決定高貢獻大致出現在哪段時間。</p></section><section id="dg-d15_eepas_kernels-panel-space" data-detail="space" aria-label="空間核"><h4>空間核</h4><p>空間核以輸入震央為中心，依其規模決定尺度。將三核乘積積分到某個窗、格與規模箱，才得到格箱期望數的貢獻。</p></section></div><p class="legend">選擇按鈕可查看說明；滑鼠停留、鍵盤聚焦與觸控皆可操作。</p></div>
