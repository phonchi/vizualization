 ><label for="dg-d09_kernel_smoothing-choice-sum">相加後的率面</label></span></div><div class="details" aria-live="polite"><section id="dg-d09_kernel_smoothing-panel-source1" data-detail="source1" aria-label="震央 1"><h4>震央 1</h4><p>核把一顆過去事件的貢獻分配到附近位置。距離越遠通常越小，並不只填入震央所在那一格。</p></section><section id="dg-d09_kernel_smoothing-panel-source2" data-detail="source2" aria-label="震央 2"><h4>震央 2</h4><p>第二顆事件也有自己的核。帶寬決定貢獻攤得多開；比較不同帶寬時，要同時注意核的正規化。</p></section><section id="dg-d09_kernel_smoothing-panel-sum" data-detail="sum" aria-label="相加後的率面"><h4>相加後的率面</h4><p>實線是兩條虛線逐點相加。真正預報還要把空間率積分到測試格，乘上規模分配與預報窗長度。</p></section></div><p class="legend">選擇按鈕可查看說明；滑鼠停留、鍵盤聚焦與觸控皆可操作。</p></div>
