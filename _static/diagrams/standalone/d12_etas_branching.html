<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETAS：事件也可以生出事件</title><style>:root{--dg-paper:#fbfcfd;--dg-paper-2:#eef2f7;--dg-ink:#243040;--dg-muted:#56657a;--dg-soft:#7d8797;--dg-rule:rgba(36,48,64,.12);--dg-accent:#2a78d6;--dg-accent-tint:rgba(42,120,214,.08);--dg-quake:#e34948;}html[data-theme=dark]{--dg-paper:#1e232b;--dg-paper-2:#2a313c;--dg-ink:#e9eef4;--dg-muted:#b6c0cd;--dg-soft:#8d98a8;--dg-rule:rgba(233,238,244,.18);--dg-accent:#6aa5ec;--dg-accent-tint:rgba(106,165,236,.12);--dg-quake:#f07a79;}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--dg-paper:#1e232b;--dg-paper-2:#2a313c;--dg-ink:#e9eef4;--dg-muted:#b6c0cd;--dg-soft:#8d98a8;--dg-rule:rgba(233,238,244,.18);--dg-accent:#6aa5ec;--dg-accent-tint:rgba(106,165,236,.12);--dg-quake:#f07a79;}}body{margin:0;padding:24px 16px;background:var(--dg-paper);color:var(--dg-ink);font-family:system-ui,sans-serif}main{max-width:760px;margin:auto}h1{font-family:'Instrument Serif','Noto Serif TC',serif;font-weight:400;font-size:28px}.eyebrow{color:var(--dg-muted);font-size:14px}footer{margin-top:24px;font-size:14px;color:var(--dg-muted)}</style></head><body><main><p class="eyebrow">義大利預報實驗 · tree</p><h1>ETAS：事件也可以生出事件</h1><style>
:where(:root){--dg-paper:#fbfcfd;--dg-paper-2:#eef2f7;--dg-ink:#243040;--dg-muted:#56657a;--dg-soft:#7d8797;--dg-rule:rgba(36,48,64,.12);--dg-accent:#2a78d6;--dg-accent-tint:rgba(42,120,214,.08);--dg-quake:#e34948;}
.dg-d12_etas_branching{max-width:100%;color:var(--dg-ink);font-family:'Geist','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
.dg-d12_etas_branching *{box-sizing:border-box}
.dg-d12_etas_branching svg{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;background:var(--dg-paper)}
.dg-d12_etas_branching svg text{fill:var(--dg-ink);font-size:20px}
.dg-d12_etas_branching svg .name{font-weight:600}
.dg-d12_etas_branching svg .sub{fill:var(--dg-muted);font-size:20px}
.dg-d12_etas_branching .node{fill:var(--dg-paper-2);stroke:var(--dg-muted);stroke-width:1.2}
.dg-d12_etas_branching .focal{fill:var(--dg-accent-tint);stroke:var(--dg-accent);stroke-width:2}
.dg-d12_etas_branching .edge{fill:none;stroke:var(--dg-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dg-d12_etas_branching .curve{fill:none;stroke:var(--dg-accent);stroke-width:3;stroke-linejoin:round}
.dg-d12_etas_branching .curve-other{fill:none;stroke:var(--dg-muted);stroke-width:2;stroke-dasharray:8 4;stroke-linejoin:round}
.dg-d12_etas_branching .curve-faint{fill:none;stroke:var(--dg-muted);stroke-width:2;stroke-dasharray:2 4;stroke-linejoin:round}
.dg-d12_etas_branching .fill{fill:var(--dg-accent-tint);stroke:var(--dg-accent);stroke-width:2}
.dg-d12_etas_branching .dot{fill:var(--dg-ink);stroke:var(--dg-paper);stroke-width:2}
.dg-d12_etas_branching .event{fill:var(--dg-quake);stroke:var(--dg-paper);stroke-width:2}
.dg-d12_etas_branching .grid{fill:none;stroke:var(--dg-rule);stroke-width:1}
.dg-d12_etas_branching .choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.dg-d12_etas_branching .choices label{display:block;font:inherit;font-size:15px;line-height:1.4;min-height:44px;padding:8px 12px;border:1px solid var(--dg-muted);border-radius:6px;background:var(--dg-paper);color:var(--dg-ink);cursor:pointer}
.dg-d12_etas_branching .choices input:checked + label{border-color:var(--dg-accent);background:var(--dg-accent-tint);font-weight:600}
.dg-d12_etas_branching .choices input:focus-visible + label{outline:3px solid var(--dg-accent);outline-offset:3px}
.dg-d12_etas_branching .details{border-top:1px solid var(--dg-rule);padding-top:12px;margin-top:8px;min-height:100px}
.dg-d12_etas_branching .details p,.dg-d12_etas_branching .intro{font-size:16px;line-height:1.8;margin:0 0 8px}
.dg-d12_etas_branching .details h4{font-family:inherit;font-weight:600;font-size:16px;line-height:1.5;margin:0 0 4px}
.dg-d12_etas_branching [hidden]{display:none}
.dg-d12_etas_branching .choices input{position:absolute;width:1px;height:1px;opacity:0}
.dg-d12_etas_branching .legend{font-size:14px;line-height:1.7;color:var(--dg-muted);margin:8px 0}
@media(prefers-reduced-motion:reduce){.dg-d12_etas_branching svg [data-detail-mark]{transition:none}}
@media print{.dg-d12_etas_branching .choices{display:none}.dg-d12_etas_branching [hidden]{display:block}.dg-d12_etas_branching.enhanced svg [data-detail-mark]{opacity:1}.dg-d12_etas_branching .details{min-height:0}}

.dg-d12_etas_branching:has(#dg-d12_etas_branching-choice-background:checked) [data-detail]:not([data-detail="background"]){display:none}
.dg-d12_etas_branching:has(#dg-d12_etas_branching-choice-first:checked) [data-detail]:not([data-detail="first"]){display:none}
.dg-d12_etas_branching:has(#dg-d12_etas_branching-choice-second:checked) [data-detail]:not([data-detail="second"]){display:none}
.dg-d12_etas_branching svg [data-detail-mark]{opacity:1}
@media (hover:hover) and (pointer:fine){.dg-d12_etas_branching:has(label:hover) [data-detail]{display:none!important}
.dg-d12_etas_branching:has(label[for="dg-d12_etas_branching-choice-background"]:hover) [data-detail="background"]{display:block!important}
.dg-d12_etas_branching:has(label:hover) [data-detail]{display:none!important}
.dg-d12_etas_branching:has(label[for="dg-d12_etas_branching-choice-first"]:hover) [data-detail="first"]{display:block!important}
.dg-d12_etas_branching:has(label:hover) [data-detail]{display:none!important}
.dg-d12_etas_branching:has(label[for="dg-d12_etas_branching-choice-second"]:hover) [data-detail="second"]{display:block!important}}
@media print{.dg-d12_etas_branching [data-detail]{display:block!important}.dg-d12_etas_branching [data-detail-mark]{opacity:1!important}}
</style><div class="dg-d12_etas_branching" data-teaching-widget="d12_etas_branching"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="dg-d12_etas_branching-title dg-d12_etas_branching-desc"><title id="dg-d12_etas_branching-title">ETAS：事件也可以生出事件</title><desc id="dg-d12_etas_branching-desc">一顆背景事件產生兩個第一代後代，其中一個再產生第二代；分支比是平均直接後代數。</desc><path d="M 216 92 V 112 Q 216 120 208 120 H 120 Q 112 120 112 128 V 152" class="edge"/><path d="M 264 92 V 112 Q 264 120 272 120 H 360 Q 368 120 368 128 V 152" class="edge"/><path d="M 112 216 V 248 Q 112 256 120 256 H 232 Q 240 256 240 264 V 288" class="edge"/><g data-detail-mark="background"><rect x="128" y="16" width="224" height="76" rx="8" class="node focal"/><text x="240.0" y="48" class="name" text-anchor="middle">背景事件</text><text x="240.0" y="76" class="sub" text-anchor="middle">第 0 代</text></g><g data-detail-mark="first"><rect x="24" y="152" width="176" height="64" rx="8" class="node "/><text x="112.0" y="184" class="name" text-anchor="middle">直接後代 A</text><rect x="280" y="152" width="176" height="64" rx="8" class="node "/><text x="368.0" y="184" class="name" text-anchor="middle">直接後代 B</text></g><g data-detail-mark="second"><rect x="128" y="288" width="224" height="76" rx="8" class="node "/><text x="240.0" y="320" class="name" text-anchor="middle">A 的直接後代</text><text x="240.0" y="348" class="sub" text-anchor="middle">根事件的第 2 代</text></g><text x="240" y="412" class="sub" text-anchor="middle">連線表示觸發親子關係</text></svg><div class="choices" role="group" aria-label="選擇圖中概念；也可用 Tab 與方向鍵"><span><input type="radio" id="dg-d12_etas_branching-choice-background" name="dg-d12_etas_branching-choice" value="background" aria-controls="dg-d12_etas_branching-panel-background" checked><label for="dg-d12_etas_branching-choice-background">背景事件</label></span><span><input type="radio" id="dg-d12_etas_branching-choice-first" name="dg-d12_etas_branching-choice" value="first" aria-controls="dg-d12_etas_branching-panel-first" ><label for="dg-d12_etas_branching-choice-first">第 1 代</label></span><span><input type="radio" id="dg-d12_etas_branching-choice-second" name="dg-d12_etas_branching-choice" value="second" aria-controls="dg-d12_etas_branching-panel-second" ><label for="dg-d12_etas_branching-choice-second">第 2 代</label></span></div><div class="details" aria-live="polite"><section id="dg-d12_etas_branching-panel-background" data-detail="background" aria-label="背景事件"><h4>背景事件</h4><p>背景機制產生第 0 代事件。這些事件可以觸發後代，也可能沒有後代。</p></section><section id="dg-d12_etas_branching-panel-first" data-detail="first" aria-label="第 1 代"><h4>第 1 代</h4><p>這張示意樹有兩顆直接後代；真實模型的數量是隨機的，不能把這張樹的 2 當作分支比。</p></section><section id="dg-d12_etas_branching-panel-second" data-detail="second" aria-label="第 2 代"><h4>第 2 代</h4><p>後代還能觸發自己的後代。分支比 n 指平均直接後代數；多代總數是另一個量。</p></section></div><p class="legend">選擇按鈕可查看說明；滑鼠停留、鍵盤聚焦與觸控皆可操作。</p></div>
<footer>可離線閱讀；字型沿用系統已安裝的字型。</footer></main></body></html>
